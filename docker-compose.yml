# Local development. Neo4j alone, or with the service under the "service" profile
# (production: deploy/docker-compose.prod.yml):
#   docker compose up -d neo4j
#   docker compose --profile service up -d
services:
  neo4j:
    image: neo4j:5.26.0
    ports: ['127.0.0.1:7474:7474', '127.0.0.1:7687:7687']
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes: [neo4j_data:/data, neo4j_logs:/logs]
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:7474 || exit 1']
      interval: 10s
      retries: 10

  service:
    profiles: [service]
    build: .
    command: ['florque-service', 'serve', '--host', '0.0.0.0', '--port', '8000']
    ports: ['127.0.0.1:8000:8000']
    environment:
      FLORQUE_STORE: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      FLORQUE_HUB_DB: /data/hub.sqlite
      FLORQUE_SERVICE_DB: /data/service.sqlite
      FLORQUE_ONTOLOGY_DB: /data/ontologies.sqlite
    volumes: [hub_data:/data]
    depends_on:
      neo4j: {condition: service_healthy}

volumes: { neo4j_data: {}, neo4j_logs: {}, hub_data: {} }
