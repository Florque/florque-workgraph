[project]
name = "florque-signal-hub"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "florque-graph-core",
  "pydantic>=2.7",
  "packaging>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/florque_signal_hub"]

[tool.uv.sources]
florque-graph-core = { workspace = true }
