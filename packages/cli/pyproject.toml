[project]
name = "florque-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "florque-client",
  "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/florque_cli"]

[tool.uv.sources]
florque-client = { workspace = true }

[project.scripts]
fwg = "florque_cli.main:app"
