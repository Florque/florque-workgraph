[project]
name = "florque-cli"
version = "0.2.0"
description = "fwg: the Florque Workgraph CLI for agents and humans"
requires-python = ">=3.11"
dependencies = [
  "florque-client>=0.2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
# Local mode (graph on this machine) needs the whole engine.
local = ["florque-client[local]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/florque_cli"]

[tool.uv.sources]
florque-client = { workspace = true }

[project.scripts]
fwg = "florque_cli.main:app"
