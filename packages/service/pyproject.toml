[project]
name = "florque-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "florque-client",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "apscheduler>=3.10,<4",
  "argon2-cffi>=23",
  "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/florque_service"]

[tool.uv.sources]
florque-client = { workspace = true }

[project.scripts]
florque-service = "florque_service.app:main"
