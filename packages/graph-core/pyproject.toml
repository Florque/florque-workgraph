[project]
name = "florque-graph-core"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "linkml-runtime>=1.8",
  "neo4j>=5.20",
  "pydantic>=2.7",
  "rapidfuzz>=3.9",
  "PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/florque_graph_core"]
