name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      memgraph:
        image: memgraph/memgraph
        ports:
          - 7687:7687

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .

    - name: Run tests
      run: |
        pytest
      working-directory: ./florque-workgraph
      env:
        MEMGRAPH_HOST: localhost
        MEMGRAPH_PORT: 7687
