name: release
# Tag vX.Y.Z -> image ghcr.io/<owner>/florque-workgraph:vX.Y.Z (+ latest) and wheels on the release.
# Deploy is manual: Actions -> release -> Run workflow (tag), needs secrets DEPLOY_HOST,
# DEPLOY_USER and DEPLOY_SSH_KEY (a key allowed to run /srv/florque/deploy.sh).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, e.g. v0.2.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check packages tests
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run fwg-gen --check
      - run: uv run pytest -m "not neo4j"
      - name: Versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          for f in packages/*/pyproject.toml; do
            grep -q "^version = \"$want\"" "$f" || { echo "$f is not $want"; exit 1; }
          done
      - run: uv build --all-packages --wheel --out-dir dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/florque-workgraph" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $TAG"; exit 1; }
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd /srv/florque && FLORQUE_TAG=$TAG ./deploy.sh"
